<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <defs>
    <linearGradient id="grad_buick" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="shadow_buick" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Card Outer Background -->
  <rect width="400" height="300" rx="16" fill="#f8fafc" />
  
  <!-- Metallic Emblem Shield -->
  <rect x="50" y="30" width="300" height="240" rx="28" fill="url(#grad_buick)" filter="url(#shadow_buick)" stroke="rgba(255,255,255,0.2)" stroke-width="2" />
  
  <!-- Inner Ring Accent -->
  <circle cx="200" cy="135" r="65" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="4" stroke-dasharray="6,4" />
  <circle cx="200" cy="135" r="55" fill="rgba(255,255,255,0.1)" stroke="rgba(255,255,255,0.6)" stroke-width="3" />
  
  <!-- Emblem Initials -->
  <text x="200" y="148" font-family="'Outfit', 'Helvetica', 'Arial', sans-serif" font-weight="900" font-size="44" fill="#ffffff" text-anchor="middle" letter-spacing="2">BU</text>
  
  <!-- Brand Title -->
  <text x="200" y="232" font-family="'Outfit', 'Helvetica', 'Arial', sans-serif" font-weight="800" font-size="20" fill="#ffffff" text-anchor="middle" letter-spacing="3">BUICK</text>
</svg>